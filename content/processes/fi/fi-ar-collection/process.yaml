id: fi-ar-collection
type: process
title:
  zh: 应收与收款
  en: Receivables and Collection
module: fi
flow: order-to-cash
stage: payment
summary:
  zh: 从录入收款、客户清账、催款到余额分析的应收闭环。
  en: The receivables loop from incoming payment and clearing to dunning and balance analysis.
variant: core
steps:
  - fi-f28-post-incoming-payment
  - fi-f32-clear-customer
  - fi-f150-dunning
  - fi-fbl5n-customer-balance
edges:
  - from: fi-f28-post-incoming-payment
    to: fi-f32-clear-customer
    kind: sequence
    label:
      zh: 录入收款
      en: Post incoming payment
  - from: fi-f32-clear-customer
    to: fi-f150-dunning
    kind: sequence
    label:
      zh: 客户清账
      en: Clear customer
  - from: fi-f150-dunning
    to: fi-fbl5n-customer-balance
    kind: sequence
    label:
      zh: 催款与余额
      en: Dunning and balance
roles:
  - 应收会计
  - 出纳
  - 销售内勤
outcomes:
  - 收款凭证
  - 清账结果
  - 催款记录
status: draft
sapVersion: S/4HANA 2023
sources:
  - sap-help-s4hana
updatedAt: 2026-11-26
