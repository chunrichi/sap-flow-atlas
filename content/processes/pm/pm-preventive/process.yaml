  - from: pm-ip30-deadline-monitor
    to: pm-iw31-maintenance-order
    kind: sequence
    label:
      zh: 生成订单
      en: Create order
roles:
  - 维护计划员
  - 维修工程师
  - 成本会计
outcomes:
  - 维护计划
  - 到期清单
  - 维护订单
