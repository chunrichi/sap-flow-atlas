id: sd-credit-management
type: process
title:
  zh: 信用管理
  en: Credit Management
module: sd
flow: order-to-cash
stage: order
summary:
  zh: 维护客户信用额度，执行订单信用检查，并处理被冻结的销售订单。
  en: Maintains customer credit limits, runs credit checks and releases blocked sales orders.
steps:
  - sd-fd32-maintain-credit-limit
  - sd-vkm3-credit-check
  - sd-vkm3-release-order
  - sd-fd33-credit-exposure
edges:
  - from: sd-fd32-maintain-credit-limit
    to: sd-vkm3-credit-check
    kind: sequence
    label:
      zh: 检查信用
      en: 检查信用
  - from: sd-vkm3-credit-check
    to: sd-vkm3-release-order
    kind: sequence
    label:
      zh: 释放订单
      en: 释放订单
  - from: sd-vkm3-release-order
    to: sd-fd33-credit-exposure
    kind: sequence
    label:
      zh: 查看敞口
      en: 查看敞口
roles:
  - 信用管理员
  - 销售经理
  - 应收会计
outcomes:
  - 信用额度
  - 信用检查结果
  - 释放记录
status: draft
sapVersion: S/4HANA 2023
sources:
  - sap-help-s4hana
updatedAt: 2026-11-26
variant: optional
trigger:
  zh: 客户启用信用管理且订单超过信用限额或触发冻结时才进入；未启用信用管理的订单直接放行。
  en: Only when credit management is active and an order exceeds the limit or gets blocked; orders without credit management pass directly.
