id: pp-production-order
type: process
title:
  zh: 生产订单执行
  en: Production Order Execution
module: pp
flow: plan-to-produce
stage: produce
summary:
  zh: 创建与下达生产订单、发料、工序确认、收货与订单结算。
  en: Creates and releases production orders, issues components, confirms operations, receives and settles.
steps:
  - pp-co01-create-production-order
  - pp-co02-release-order
