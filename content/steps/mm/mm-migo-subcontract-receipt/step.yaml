  - "table:MSEG"
  - "table:EKBE"
  - "table:RESB"
snippets:
  - abap-mm-po-history
crossModule:
  - module: fi
    relation: accounting-impact
    note: 成品收货与组件消耗共同影响存货与 GR/IR。
