flows:
  - procure-to-pay
tcode: ME41
summary:
  zh: 向多个供应商发出询价请求，记录物料、数量与报价截止日期。
  en: Sends requests for quotation to multiple vendors with materials, quantities and quotation deadlines.
inputs:
  - 物料
  - 数量
  - 供应商
  - 报价截止日
outputs:
  - 询价单号
  - 待报价行
rules:
  - 询价可以引用采购申请，减少重复录入。
  - 截止日期后不再接受报价。
painPoints:
  - 供应商未维护采购视图，无法发送询价。
  - 截止日期时区处理不一致。
