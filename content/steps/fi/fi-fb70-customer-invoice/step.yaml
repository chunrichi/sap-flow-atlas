tcode: FB70
summary:
  zh: 手工录入客户发票，生成应收凭证与收入。
  en: Posts a customer invoice manually, creating a receivable and revenue.
inputs:
  - 客户
  - 发票金额
  - 税额
  - 收入科目
outputs:
