tcode: AS03
summary:
  zh: 查看资产主数据、折旧范围与已过账业务。
  en: Displays asset master data, depreciation areas and posted transactions.
inputs:
  - 资产编号
  - 公司代码
outputs:
  - 资产主数据
  - 折旧范围
