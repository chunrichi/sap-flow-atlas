tcode: PP01
summary:
  zh: 创建或维护组织单位、岗位与职务等对象。
  en: Creates or maintains organization units, positions and jobs.
inputs:
  - 组织单位
  - 岗位
  - 职务
  - 上级
outputs:
  - 组织对象
rules:
  - 组织对象必须有有效期与上级。
  - 岗位必须归属组织单位。
painPoints:
  - 有效期重叠导致组织架构异常。
  - 岗位未分配职务，无法推导默认属性。
