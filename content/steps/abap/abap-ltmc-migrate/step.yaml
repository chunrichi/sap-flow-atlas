condition:
  zh: S/4HANA 迁移项目使用迁移 Cockpit 时才执行；老系统仍可能使用 LSMW。
  en: Only for S/4HANA migration projects using the Migration Cockpit; legacy programs may still use LSMW.
inputs:
  - 迁移项目
