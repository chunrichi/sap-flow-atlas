id: abap-iwfnd-gw-client
type: step
title:
  zh: 测试 OData 服务
  en: Test OData Service
primaryModule: abap
modules:
  - abap
processes:
  - abap-odata-service
flows:
  - develop-to-deploy
tcode: /IWFND/GW_CLIENT
summary:
  zh: 用 Gateway Client 发起 OData 读写请求，检查 HTTP 状态与返回负载。
  en: Sends OData read and write requests through the Gateway Client to check HTTP status and payload.
inputs:
  - 服务 URL
  - HTTP 方法
  - 请求体
outputs:
  - 响应负载
  - 错误码
rules:
  - 测试使用只读账号，写入测试需回滚。
  - 错误码要结合 Gateway 日志定位。
painPoints:
  - 只测 GET 不测错误分支，上线后写入失败。
  - 用生产账号测试，产生脏数据。
objects:
  - tcode:/IWFND/GW_CLIENT
  - odata:API_SALES_ORDER_SRV
  - class:CL_HTTP_CLIENT
