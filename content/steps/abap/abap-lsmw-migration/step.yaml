  en: Configure Migration Object
primaryModule: abap
modules:
  - abap
processes:
  - abap-migration
flows:
  - develop-to-deploy
tcode: LSMW
summary:
  zh: 定义迁移对象、源文件结构与字段映射。
  en: Defines migration objects, source file structure and field mapping.
optional: true
condition:
  zh: 上线、合并或主数据切换需要批量导入历史数据时才执行；日常业务录入不经过该步骤。
  en: Only for cutover, mergers or master-data migration requiring bulk historical data loads; daily entry does not use it.
inputs:
  - 迁移对象
  - 源文件
  - 字段映射
outputs:
  - 批输入会话/IDoc
rules:
  - 先小批量验证再全量。
  - 字段映射必须覆盖必填字段。
painPoints:
  - 源数据质量差，失败率高。
  - 金额与单位未换算。
