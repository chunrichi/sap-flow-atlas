updatedAt: '2026-11-26'
optional: true
condition:
  zh: 只在需要查看 MRP 清单或例外消息时执行；可直接在 MD04 中处理单物料。
  en: Only when reviewing the MRP list or exception messages; a single material can be handled in MD04.
