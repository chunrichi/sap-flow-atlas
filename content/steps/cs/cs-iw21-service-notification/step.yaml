tcode: IW21
summary:
  zh: 记录客户报修、设备故障与响应优先级，作为派工依据。
  en: Records customer service requests, equipment faults and response priority as the basis for dispatching.
inputs:
  - 客户
  - 设备
  - 故障描述
  - 优先级
outputs:
  - 服务通知
rules:
  - 通知必须关联客户与设备。
  - 优先级决定响应时限。
painPoints:
  - 设备主数据缺失，无法建单。
  - 故障描述不清导致派工错误。
